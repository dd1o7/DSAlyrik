# Build from the repository root:
#   flatpak-builder --user --install build-flatpak packaging/flatpak/io.github.dd1o7.DSAlyrik.yml
app-id: io.github.dd1o7.DSAlyrik
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: dsalyrik
finish-args:
  # Overlay window: XWayland gives keep-above and click-through on KDE (see README).
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Lyrics from LRCLIB and remote album art only.
  - --share=network
  # Read now-playing data and show the tray icon. Portals (idle inhibit) need no extra permission.
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  # Hide over fullscreen apps: load a small KWin script that calls back (KDE only).
  - --talk-name=org.kde.KWin
  # Read-only Music folder: sidecar .lrc files next to local tracks (real word timing).
  # Album art given as a local path elsewhere falls back to manual colors.
  - --filesystem=xdg-music:ro
modules:
  - name: dsalyrik
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDSALYRIK_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
